hostname: "raspberrysrv"
agent.hostname: "filebeat-raspberrysrv"
name: "raspberrysrv"
tags: ["siemids", "suricata", "raspberrysrv", "adguard", "auditd"]

filebeat.config.inputs:
  enabled: true
  reload.enabled: true
  reload.period: 10s

# AdGuard Home's query log is newline-delimited JSON -- parse it directly
# rather than via a filebeat module (AdGuard has none). Tagged as its own
# "adguard.log" dataset since its field shape doesn't match pihole.log; the
# existing DNS Dashboard saved search would need its query extended to
# include this dataset too.
filebeat.inputs:
  - type: filestream
    id: adguard-querylog
    enabled: true
    paths:
      - /adguard/querylog.json
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields:
      event.dataset: adguard.log
    fields_under_root: true

#============================= Filebeat modules ===============================

filebeat.config.modules:
  # Glob pattern for configuration loading
  path: ${path.config}/modules.d/*.yml

  # Set to true to enable config reloading
  reload.enabled: true

  # Period on which files under path should be checked for changes
  reload.period: 120s

# suricata module ships Suricata's eve.json from this host (see modules.d/).
# auditd/system modules below mirror the ELK host's own OS log collection,
# but for this host's OS (Pi's own audit.log/syslog/auth.log), since the
# Pi's syslog/auth/audit events are not the ELK host's.
filebeat.modules:
  - module: auditd
    log:
      enabled: true
      var.paths: ["/var/log/audit/audit.log*"]
  - module: system
    syslog:
      enabled: true
      var.paths: ["/var/log/syslog*"]
    auth:
      enabled: true
      var.paths: ["/var/log/auth.log*"]

# ======================= Elasticsearch template setting =======================

# Single-node cluster (skynetpi) -- number_of_replicas: 1 meant 3 replica
# shards could never be assigned (no second node to host them), permanently
# stuck "yellow" and adding pure allocation-retry overhead for nothing.
# number_of_shards: 3 was also drastically oversized for this deployment's
# actual volume (~50MB/day) on a 4-core Pi; Elastic's own general guidance
# targets 10-50GB *per shard*, not splitting something this small 3 ways --
# each shard carries fixed overhead (translog, merge scheduler, segment
# readers) that adds up on a 3.7GB host already tight on memory. Confirmed
# Elasticsearch pinned at ~99% of its container memory limit in steady state
# before this; see DEPLOYMENT.md. refresh_interval widened from the 1s
# default since sub-second search freshness isn't needed for a SIEM/log use
# case, trading it for less merge/I/O overhead on the SD card.
# Filebeat only pushes its index template once and never touches it again if
# one by that name already exists -- confirmed the above settings silently
# had zero effect until the template was overwritten directly via the ES API
# (PUT _index_template/filebeat-8.17.4). overwrite: true makes future
# settings changes here actually take effect on the next filebeat restart.
setup.template.overwrite: true
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0
  index.refresh_interval: 30s

# ================================= Processors =================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_kubernetes_metadata: ~
  # add_host_metadata's hostname resolution is unreliable in this container
  # setup (Podman leaks the host's own /etc/hosts entry alongside the
  # container's, so go-sysinfo flip-flops between the two, and sometimes the
  # container ID, across lookups within the same process). Force a
  # deterministic value instead of trusting it.
  - add_fields:
      target: 'host'
      fields:
        hostname: 'raspberrysrv'
        name: 'raspberrysrv'

###
### AdGuard Home query log field mapping
### (raw fields: T=timestamp, QH=query host, QT=query type, IP=client IP,
### Upstream=resolver used, Result.IsFiltered=whether the query was blocked)
###

  - timestamp:
      when:
        has_fields: ["T"]
      field: "T"
      layouts:
        - "2006-01-02T15:04:05.999999999Z07:00"
      test:
        - "2026-07-18T02:56:40.405985905+01:00"
  - rename:
      when:
        has_fields: ["IP"]
      fields:
        - from: "IP"
          to: "source.ip"
      ignore_missing: true
  - rename:
      when:
        has_fields: ["QH"]
      fields:
        - from: "QH"
          to: "dns.question.name"
        - from: "QT"
          to: "dns.question.type"
      ignore_missing: true
  - if:
      has_fields: ["Result"]
    then:
      - if:
          equals:
            Result.IsFiltered: true
        then:
          - add_fields:
              target: ""
              fields:
                event.outcome: "failure"
                event.action: "blocked"
        else:
          - add_fields:
              target: ""
              fields:
                event.outcome: "success"
                event.action: "allowed"

###
### Local Networks / WireGuard / PIA VPN / VPN Hop / PIA DNS Hop / DNS PIA
### UPSTREAM geo-enrichment: moved server-side.
###
### These used to be eight client-side add_fields blocks here (three CIDR
### profiles x source/destination, plus two synthetic map-layer fields),
### driven by env vars baked into this container at creation time. That
### meant an IP change (WAN renewed, wg0/pia reassigned) required a full
### Filebeat *recreate* to pick up new values -- risky, since the registry
### isn't persisted (see DEPLOYMENT.md). Equivalent enrichment now happens
### server-side via an Elasticsearch Enrich processor spliced into
### filebeat-8.17.4-suricata-eve-pipeline (see resources/elasticsearch/ and
### scripts/setup-geo-enrichment.sh) -- an IP change now only needs
### scripts/refresh-filebeat-enrichment.sh to update a small ES index and
### re-execute two enrich policies, never touching Filebeat itself.

output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOSTS}"]
  username: elastic
  password: '${ELASTICSEARCH_PASSWORD}'
  ssl:
    certificate_authorities: "/usr/share/elasticsearch/config/certs/ca/ca.crt"
    certificate: "/usr/share/elasticsearch/config/certs/filebeat/filebeat.crt"
    key: "/usr/share/elasticsearch/config/certs/filebeat/filebeat.key"
