inputs:
  - id: logfile-system-e42dd6ab-26fe-40c3-896a-1c3822b4b248
    name: system-1
    revision: 1
    type: logfile
    use_output: default
    meta:
      package:
        name: system
        version: 1.41.0
    data_stream:
      namespace: default
    package_policy_id: e42dd6ab-26fe-40c3-896a-1c3822b4b248
    streams:
      - id: logfile-system.auth-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.auth
          type: logs
        ignore_older: 72h
        paths:
          - /var/log/auth.log*
          - /var/log/secure*
        exclude_files:
          - .gz$
        multiline:
          pattern: ^\s
          match: after
        tags:
          - system-auth
        processors:
          - add_locale: null
      - id: logfile-system.syslog-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.syslog
          type: logs
        paths:
          - /var/log/messages*
          - /var/log/syslog*
          - /var/log/system*
        exclude_files:
          - .gz$
        multiline:
          pattern: ^\s
          match: after
        processors:
          - add_locale: null
        ignore_older: 72h
  - id: winlog-system-e42dd6ab-26fe-40c3-896a-1c3822b4b248
    name: system-1
    revision: 1
    type: winlog
    use_output: default
    meta:
      package:
        name: system
        version: 1.41.0
    data_stream:
      namespace: default
    package_policy_id: e42dd6ab-26fe-40c3-896a-1c3822b4b248
    streams:
      - id: winlog-system.application-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        name: Application
        data_stream:
          dataset: system.application
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
      - id: winlog-system.security-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        name: Security
        data_stream:
          dataset: system.security
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
      - id: winlog-system.system-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        name: System
        data_stream:
          dataset: system.system
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
  - id: system/metrics-system-e42dd6ab-26fe-40c3-896a-1c3822b4b248
    name: system-1
    revision: 1
    type: system/metrics
    use_output: default
    meta:
      package:
        name: system
        version: 1.41.0
    data_stream:
      namespace: default
    package_policy_id: e42dd6ab-26fe-40c3-896a-1c3822b4b248
    streams:
      - id: system/metrics-system.cpu-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.cpu
          type: metrics
        metricsets:
          - cpu
        cpu.metrics:
          - percentages
          - normalized_percentages
        period: 10s
      - id: system/metrics-system.diskio-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.diskio
          type: metrics
        metricsets:
          - diskio
        diskio.include_devices: null
        period: 10s
      - id: system/metrics-system.filesystem-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.filesystem
          type: metrics
        metricsets:
          - filesystem
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.filesystem.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.fsstat-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.fsstat
          type: metrics
        metricsets:
          - fsstat
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.fsstat.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.load-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.load
          type: metrics
        metricsets:
          - load
        condition: '${host.platform} != ''windows'''
        period: 10s
      - id: system/metrics-system.memory-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.memory
          type: metrics
        metricsets:
          - memory
        period: 10s
      - id: system/metrics-system.network-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.network
          type: metrics
        metricsets:
          - network
        period: 10s
        network.interfaces: null
      - id: system/metrics-system.process-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.process
          type: metrics
        metricsets:
          - process
        period: 10s
        process.include_top_n.by_cpu: 5
        process.include_top_n.by_memory: 5
        process.cmdline.cache.enabled: true
        process.cgroups.enabled: false
        process.include_cpu_ticks: false
        processes:
          - .*
      - id: >-
          system/metrics-system.process.summary-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.process.summary
          type: metrics
        metricsets:
          - process_summary
        period: 10s
      - id: >-
          system/metrics-system.socket_summary-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.socket_summary
          type: metrics
        metricsets:
          - socket_summary
        period: 10s
      - id: system/metrics-system.uptime-e42dd6ab-26fe-40c3-896a-1c3822b4b248
        data_stream:
          dataset: system.uptime
          type: metrics
        metricsets:
          - uptime
        period: 10s
  - id: httpjson-ti_otx-b8c98e83-397c-44c2-940b-287338b18329
    name: ti_otx-1
    revision: 1
    type: httpjson
    use_output: default
    meta:
      package:
        name: ti_otx
        version: 1.18.0
    data_stream:
      namespace: default
    package_policy_id: b8c98e83-397c-44c2-940b-287338b18329
    streams:
      - id: httpjson-ti_otx.threat-b8c98e83-397c-44c2-940b-287338b18329
        data_stream:
          dataset: ti_otx.threat
          type: logs
        config_version: '2'
        interval: 5m
        request.method: GET
        request.url: 'https://otx.alienvault.com/api/v1/indicators/export'
        request.timeout: 30s
        request.transforms:
          - set:
              target: header.Content-Type
              value: application/json
          - set:
              target: header.X-OTX-API-KEY
              value: 4daa2a9e13deb6172bb8c79e6768ca3ebb6ed1b7bf986bb594e5e0287cfbad4a
          - set:
              target: url.params.modified_since
              value: '[[.cursor.timestamp]]'
              default: '[[ formatDate (now (parseDuration "-400h")) "RFC3339" ]]'
        response.split:
          target: body.results
          keep_parent: true
        response.pagination:
          - set:
              target: url.value
              value: '[[ .last_response.body.next ]]'
        cursor:
          timestamp:
            value: '[[ formatDate (now (parseDuration "-1h")) "RFC3339" ]]'
        tags:
          - forwarded
          - otx-threat
        publisher_pipeline.disable_host: true
